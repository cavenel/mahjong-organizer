# Production overlay — run with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from dev:
#   - web: prod settings, gunicorn.conf.py, Unix socket (no exposed port)
#   - nginx: reverse-proxy to socket, serves static files, terminates TLS
#   - certbot: issues/renews the wildcard cert via DNS-01 challenge

services:

  web:
    environment:
      DJANGO_SETTINGS_MODULE: apps.settings.prod
    # Copy baked staticfiles to the shared volume, then migrate, then serve.
    command: ["sh", "-c", "cp -r /app/staticfiles/. /static/ && python manage.py migrate --noinput && exec gunicorn -c gunicorn.conf.py apps.asgi:application"]
    volumes:
      - gunicorn_sock:/run/gunicorn
      - static_files:/static
      - ./captures:/app/mahj/captures
      - ${MAHJ_BACKUP_DIR:-/opt/mahj-backups}:/backups:ro   # list dumps on the restore page
    ports: []    # nginx handles external traffic; web is not exposed directly
    # Probe the request path, not just the socket file: a hung gunicorn still owns a
    # bound socket, so `test -S` would call it healthy forever. curl over the socket
    # times out iff a worker can't answer. We deliberately omit `-f`: any HTTP reply
    # proves the worker ran the request, so a SECURE_SSL_REDIRECT 301 or an
    # ALLOWED_HOSTS 400 still counts as alive (the 301 short-circuits in middleware
    # before the leaderboard renders, so the probe stays cheap). This still gates
    # nginx startup, since curl can't connect until the socket is bound. 6 retries ×
    # 5s ⇒ ~30s of sustained no-response before unhealthy.
    #
    # NB: an "unhealthy" mark does NOT restart the container — `restart: unless-stopped`
    # only fires on process exit. So a wedged (not crashed) gunicorn surfaces as
    # `(unhealthy)` in `docker ps` for an operator to `restart web` by hand; there is
    # no automatic watchdog by design (an operator is watching the screens live).
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null --max-time 4 --unix-socket /run/gunicorn/mahjong.sock http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 30s    # absorb migrations on a fresh DB

  # OCR workers run prod settings; everything else (build, command, queue,
  # ./captures mount, replicas) is inherited from the base compose file.
  scan_worker:
    environment:
      DJANGO_SETTINGS_MODULE: apps.settings.prod

  # Restore worker runs prod settings; everything else (command, /backups mount,
  # pull config) is inherited from the base compose file.
  restore_worker:
    environment:
      DJANGO_SETTINGS_MODULE: apps.settings.prod

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    # Bound access/error logs (anchors don't cross compose files; mirror the base
    # file's x-logging cap). 20m × 5 ⇒ ~100m ceiling on a busy multi-day event.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount the directory, not the single file: a single-file bind mount pins to
      # the inode at container start, so editor (atomic-replace) edits never reach
      # the container and `nginx -s reload` re-reads stale config. With the dir
      # mounted, edits are live and a reload picks them up. (nginx loads conf.d/*.conf;
      # the image's default.conf is shadowed by this mount.)
      - ./nginx:/etc/nginx/conf.d:ro
      - gunicorn_sock:/run/gunicorn
      - static_files:/app/staticfiles:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - nginx_cache:/var/cache/nginx/desktop
    depends_on:
      web:
        condition: service_healthy

  # Certbot — only runs on demand (profiles: certbot), never as a background daemon.
  #
  # First-time setup (DNS-01 challenge, wildcard cert):
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
  #     --profile certbot run --rm certbot \
  #     certonly --dns-ovh \
  #              --dns-ovh-credentials /etc/letsencrypt/ovh.ini \
  #              -d mahj.ovh -d '*.mahj.ovh' \
  #              --email <your@email> --agree-tos --no-eff-email
  #
  # Renewal (add to host cron, e.g. weekly):
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
  #     --profile certbot run --rm certbot renew --quiet
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
  #     exec nginx nginx -s reload
  certbot:
    image: certbot/dns-ovh
    profiles: ["certbot"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - ./certbot/ovh.ini:/etc/letsencrypt/ovh.ini:ro

volumes:
  gunicorn_sock:
  static_files:
  letsencrypt:
  certbot_www:
  nginx_cache:
