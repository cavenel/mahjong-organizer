# Cap every container's stdout/stderr logs: the default json-file driver is
# unbounded, so over a multi-day event logs would grow until the disk fills and
# Postgres writes start failing. 20m × 5 files ⇒ ~100m hard ceiling per service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # Django cache only — fully disposable/regenerable (sessions live in Postgres),
    # so cap memory and evict LRU under pressure instead of the default `noeviction`,
    # which fails writes when full. Default RDB snapshots stay on, giving a warm
    # cache after a graceful restart. The channel layer + scan queue do NOT live
    # here (see redis_bus): LRU must never evict a live socket's group membership.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  redis_bus:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # Channels layer + scan-OCR queue. noeviction: these keys must never be dropped
    # — evicting a WebSocket group membership would silently strand a projector
    # (socket stays OPEN, so reconnect/heartbeat never fires), and evicting a queued
    # scan would lose a job. The data is small and short-lived (transient messages +
    # active group sets), so it won't approach maxmemory; the cap is just a backstop.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  pgbouncer:
    # Pinned: this is the only third-party image that was floating, and 'latest'
    # moving under a running tournament is the failure this prevents.
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    logging: *default-logging
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-300}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-25}
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 3
      SERVER_RESET_QUERY: DISCARD ALL
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USER}"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: apps.settings.dev
      DB_HOST: pgbouncer
      REDIS_URL: redis://redis:6379/1
      REDIS_BUS_URL: redis://redis_bus:6379/0
    volumes:
      - ./captures:/app/mahj/captures
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis_bus:
        condition: service_healthy
    # -k explicitly: gunicorn autoloads ./gunicorn.conf.py, so the ASGI worker
    # class was arriving only by way of prod's config file. WebSockets break
    # silently under the default sync worker, so it is named here.
    command: sh -c "python manage.py migrate --noinput && exec gunicorn apps.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 3 --timeout 60"

  # Score-sheet OCR workers — consume the Redis scan queue off the request path.
  # Several replicas share one FIFO queue, so parallel scans are bounded here and
  # can never starve the web workers. Shares ./captures for the staged images.
  scan_worker:
    build: .
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: apps.settings.dev
      DB_HOST: pgbouncer
      REDIS_URL: redis://redis:6379/1
      REDIS_BUS_URL: redis://redis_bus:6379/0
    volumes:
      - ./captures:/app/mahj/captures
    depends_on:
      redis_bus:
        condition: service_healthy
    command: python manage.py scan_worker
    deploy:
      # 4 workers drain a round-end burst (5-10 sheets shot at once) ~2x faster
      # than 2. They share one FIFO queue (no double-processing), and ~0.5 GB each
      # under load stays well within the box's memory headroom.
      replicas: 4

volumes:
  postgres_data:
  redis_data:
