gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1000;
gzip_types text/html text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

proxy_cache_path /var/cache/nginx/desktop
                 levels=1:2
                 keys_zone=desktop_cache:10m
                 max_size=200m
                 inactive=10m
                 use_temp_path=off;

upstream django {
    server unix:/run/gunicorn/mahjong.sock;
}

# HTTP — redirect everything to HTTPS; keep ACME challenge reachable for renewals
server {
    listen 80;
    server_name *.mahj.ovh mahj.ovh;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name *.mahj.ovh mahj.ovh;

    ssl_certificate     /etc/letsencrypt/live/mahj.ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahj.ovh/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Static files served directly — bypasses Django for production traffic
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket connections (Django Channels)
    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
    }

    # Homepage: microcache for anonymous viewers.
    # Logged-in users (auth=1 cookie set by AuthCookieMiddleware) bypass — they need live data.
    location = / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;

        proxy_cache       desktop_cache;
        proxy_cache_key   "$scheme$host$request_uri$http_accept_encoding";
        proxy_cache_valid 200 20s;

        proxy_cache_bypass $cookie_auth;
        proxy_no_cache     $cookie_auth;

        proxy_cache_lock         on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale    updating error timeout http_500 http_502 http_503;

        add_header X-Cache-Status $upstream_cache_status always;
    }

    # All other requests → Gunicorn (no cache)
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
