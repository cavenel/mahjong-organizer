{{ player_rows|json_script:"player-rows-data" }}
<div class="max-w-5xl" x-data="playerEditor()">
  <div class="flex items-start justify-between gap-4 flex-wrap mb-4">
    <div>
      <h2 class="text-2xl font-bold text-gray-800">Edit players</h2>
      <p class="text-sm text-gray-500 mt-1">
        Fix names, countries, EMA ids, e-mails and teams. The draw number is set by
        Randomize / Team draw and shown here for reference.
      </p>
    </div>
    <div class="flex items-center gap-3 shrink-0">
      <span x-show="dirty" x-cloak class="text-xs text-amber-600">Unsaved changes</span>
      <button type="button" @click="save()" :disabled="!dirty || saving"
              class="px-4 py-2 text-sm font-medium text-white bg-amber-500 rounded-lg hover:bg-amber-600 disabled:opacity-50">
        <span x-show="!saving">Save changes</span>
        <span x-show="saving" x-cloak>Saving…</span>
      </button>
    </div>
  </div>

  <template x-if="rows.length === 0">
    <div class="rounded-xl border border-dashed border-gray-300 bg-white p-8 text-center text-sm text-gray-500">
      No players yet. Import a roster from a template first.
    </div>
  </template>

  <div x-show="rows.length" class="overflow-x-auto rounded-xl border border-gray-200 bg-white shadow-sm">
    <table class="min-w-full text-sm">
      <thead class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wide">
        <tr>
          <th class="px-3 py-2 text-right font-medium w-14">#</th>
          <th class="px-3 py-2 text-left font-medium">Full name</th>
          <th class="px-3 py-2 text-left font-medium">First name</th>
          <th class="px-3 py-2 text-left font-medium">Country</th>
          <th class="px-3 py-2 text-left font-medium">EMA id</th>
          <th class="px-3 py-2 text-left font-medium">E-mail</th>
          <th class="px-3 py-2 text-left font-medium">Team</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        <template x-for="row in rows" :key="row.id">
          <tr class="hover:bg-amber-50/40">
            <td class="px-3 py-1.5 text-right text-gray-400 tabular-nums" x-text="row.draw_number ?? '—'"></td>
            <td class="px-2 py-1"><input type="text" maxlength="70" x-model="row.full_name" @input="dirty=true" class="w-full min-w-[10rem] border border-transparent hover:border-gray-200 focus:border-amber-400 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-amber-300"></td>
            <td class="px-2 py-1"><input type="text" maxlength="70" x-model="row.first_name" @input="dirty=true" class="w-full min-w-[7rem] border border-transparent hover:border-gray-200 focus:border-amber-400 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-amber-300"></td>
            <td class="px-2 py-1"><input type="text" maxlength="70" x-model="row.country" @input="dirty=true" class="w-full min-w-[7rem] border border-transparent hover:border-gray-200 focus:border-amber-400 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-amber-300"></td>
            <td class="px-2 py-1"><input type="text" maxlength="70" x-model="row.EMA_ID" @input="dirty=true" class="w-full min-w-[7rem] border border-transparent hover:border-gray-200 focus:border-amber-400 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-amber-300"></td>
            <td class="px-2 py-1"><input type="text" maxlength="70" x-model="row.email" @input="dirty=true" class="w-full min-w-[10rem] border border-transparent hover:border-gray-200 focus:border-amber-400 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-amber-300"></td>
            <td class="px-2 py-1"><input type="text" maxlength="70" x-model="row.team" @input="dirty=true" class="w-full min-w-[7rem] border border-transparent hover:border-gray-200 focus:border-amber-400 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-amber-300"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>

<script>
  function playerEditor() {
    return {
      rows: JSON.parse(document.getElementById('player-rows-data').textContent),
      dirty: false,
      saving: false,
      save() {
        if (!this.dirty || this.saving) return;
        this.saving = true;
        var self = this;
        $.ajax({
          type: "POST",
          url: "/player_editor_save",
          contentType: "application/json",
          headers: { 'X-CSRFToken': '{{ csrf_token }}' },
          data: JSON.stringify({ players: this.rows }),
          success: function() { self.dirty = false; },
          error: function(xhr) {
            var msg = (xhr && xhr.responseText) || '';
            if (!msg || xhr.status >= 500 || /<html/i.test(msg)) {
              msg = 'The server rejected the changes (status ' + ((xhr && xhr.status) || '?') + ').';
            }
            window.alertAction({ title: 'Couldn’t save players', body: msg });
          },
          complete: function() { self.saving = false; }
        });
      }
    };
  }
</script>
