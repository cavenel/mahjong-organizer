{% load static %}
{% load mathfilters %}

<html>

<head>
    <link rel="icon" type="image/png" href="{% static "images/mcr_logo.png" %}" sizes="192?192">
    <title>Swedish Open MCR Mahjong Championship {{ year }}</title>
    <meta name="viewport" content="user-scalable=no" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    
    <script src="http://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <style>
        body {
            zoom:{{ variables.zoom|mul:1.3 }};
            overflow: hidden;
        }
        body,
        html {
            background-color: black;
        }

        h2 {
            color: white;
        }

        div#schedule {
            width: 900px;
            margin-left: auto;
            margin-right: auto;
            background-color: white;
            display: table;
            zoom:1.3;
        }
    </style>
</head>

<body>
    <center>
        <h2>Schedule</h2>
    </center>

    <div id="schedule" style="zoom:1.0;">
        {% regroup schedule by day as days_list %}
        {% for day in days_list %}
        <div class="col-sm-6">
          <h3>{{ day.grouper }}</h3>
          <table class="table">
            <tbody>
                {% for item in day.list %}
                    <tr {% if 'Round ' in item.name %}class="info"{% endif %}>
                        <td width="120px">{{ item.time }}</td>
                        <td>{{ item.name }}</td>
                    </tr>
                {% endfor %}
            </tbody>
          </table>
        </div>
      {% endfor %}
    </div>
    <script>
        var getUrlParameter = function getUrlParameter() {
            return window.location.href.substring(window.location.href.lastIndexOf('/') + 1)
        };


        (function() {
            var scheme = location.protocol === 'https:' ? 'wss' : 'ws';
            var subdomain = '{{ subdomain }}';
            function connect() {
                var ws = new WebSocket(scheme + '://' + location.host + '/ws/display/' + subdomain + '/');
                ws.onmessage = function() { location.reload(); };
                ws.onclose = function() { setTimeout(connect, 3000); };
                ws.onerror = function() { ws.close(); };
            }
            connect();
        })();
    </script>
</body>

</html>
