{% load static %}
{% load mathfilters %}

<html>

<head>
    <link rel="icon" type="image/png" href="{% static "images/mcr_logo.png" %}" sizes="192?192">
    <title>Swedish Open MCR Mahjong Championship {{ year }}</title>
    <meta name="viewport" content="user-scalable=no" />
    <style>
        /* Hand-rolled replacements for the handful of Bootstrap classes this page
           used (col-sm-6 / .table / .info) plus the global resets Bootstrap was
           silently providing (border-box + a sans-serif body font). Saves loading
           the 121 KB Bootstrap stylesheet + jQuery + Bootstrap JS on the Pi. */
        * { box-sizing: border-box; }
        body {
            font-family: Helvetica, Arial, sans-serif;
            zoom:{{ variables.zoom|mul:1.3 }};
            overflow: hidden;
        }
        body,
        html {
            background-color: black;
        }

        h2 {
            color: white;
        }

        div#schedule {
            width: 900px;
            margin-left: auto;
            margin-right: auto;
            background-color: white;
            display: table;
            zoom:1.3;
        }

        .col-sm-6 { float: left; width: 50%; padding: 0 15px; }
        #schedule::after { content: ""; display: table; clear: both; }
        table.table { width: 100%; max-width: 100%; margin-bottom: 20px; border-collapse: collapse; }
        table.table > tbody > tr > td { padding: 8px; line-height: 1.42857; vertical-align: top; border-top: 1px solid #ddd; }
        tr.info > td { background-color: #d9edf7; }
    </style>
</head>

<body>
    <center>
        <h2>Schedule</h2>
    </center>

    <div id="schedule" style="zoom:1.0;">
        {% regroup schedule by day as days_list %}
        {% for day in days_list %}
        <div class="col-sm-6">
          <h3>{{ day.grouper }}</h3>
          <table class="table">
            <tbody>
                {% for item in day.list %}
                    <tr {% if 'Round ' in item.name %}class="info"{% endif %}>
                        <td width="120px">{{ item.time }}</td>
                        <td>{{ item.name }}</td>
                    </tr>
                {% endfor %}
            </tbody>
          </table>
        </div>
      {% endfor %}
    </div>
    <script src="{% static 'js/display_socket.js' %}"></script>
    <script>
        connectDisplaySocket({
            subdomain: '{{ subdomain }}',
            onUpdate: function() { location.reload(); },
        });
    </script>
</body>

</html>
