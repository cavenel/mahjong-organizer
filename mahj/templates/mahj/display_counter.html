{% load static %} 
{% load mathfilters %}

<html style="background-color:black;">
<head>
  <title>Swedish Open MCR Mahjong Championship 2018</title>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="{% static "images/mcr_logo.png" %}" sizes="192?192">

  <link rel="stylesheet" href="{% static "images/flags.css" %}">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<style>
body {
    zoom:{{ variables.zoom|mul:0.6 }};
    overflow: hidden;
}
@font-face {
    font-family: digits;
    src: url({% static "font/MADE.otf" %});
}
#welcome {
    text-align:center;
    width:100%;
    color: #ccc;
    font-size: 50px;
    font-family: sans-serif;
}
#counter {
    font-family: digits;
    color: #fff;
    margin-left: auto;
    margin-right: auto;
    margin-top: 70px;
    text-align: center;
    width: 550px;
    font-size: 130px;
    line-height: 53px;
    /*text-shadow: 0px 0px 25px red, 0px 0px 25px red, 0px 0px 25px red, 0px 0px 4px red, 0px 0px 4px red, 0px 0px 4px red;*/
    border: 0px solid grey;
    /*border: 5px solid grey;*/
    padding:27px;
    /*box-shadow:0px 0px 200px #777, 0px 4px 10px #fff;*/
    border-radius: 10px;
    zoom:5;
}
.digit {
    width: 77px;
    display: inline-block;
    text-align: right;
    margin-top: 26px;
}
.colon {
    width: 30px;
    display: inline-block;
    text-align: center;
}
#countdown {
    font-size:260px;
    color:white;
    text-align: center;
}
</style>
<style>
    table{
        background-color:white;
        white-space: nowrap;
        border-collapse:collapse;width:max-content;margin-top:5px;font-size:11px;
        margin-left: auto;
        margin-right: auto;}
    table > tbody > tr > td{border:1px solid #aaa;padding:2px; padding-left:5px;padding-right:5px;}
    th {
        text-align: center;
        background-color:black;
        color:white;
    }
    #no_sound {
        padding: 5px;
        position: absolute;
        left: 10px;
        top: 10px;
        font-size: 60px;
        line-height: 84px;
        color: red;
        background-color: white;
    }
</style>

</head>
<body>
<div id="no_sound">
🔇
</div>
<div id="counter"><span class='digit' id='hours_1'>0</span><span class='digit' id='hours_2'>0</span><span class='colon'>:</span><span class='digit' id='minutes_1'>0</span><span class='digit' id='minutes_2'>0</span><span class='colon'>:</span><span class='digit' id='seconds_1'>0</span><span class='digit' id='seconds_2'>0</span></div>
<br/><br/><br/><br/><br/><br/><br/><br/>
<div id="welcome">{{variables.welcome |safe }}</div>
<div style="height: 300px; position: absolute; left: Calc(50% - 150px); top: 52px; width: 300px;">
    <div id='countdown'></div>
</div>

<script>

var time_start = {{ counter }};
var main_interval = null;
var countdown_value = -1;

function show_counter() {
    total_time = {{ variables.total_time }};
    var milliseconds = new Date().getTime();
    
    if (time_start <= 0) {
        result = 0
    }
    else if (milliseconds - time_start >= total_time*1000) {
        result = total_time
        if (Math.floor((milliseconds - time_start)/1000.0)==total_time) {
            new Audio('{% static "sounds/gong.mp3" %}').play()
        }
    }
    else {
        result = Math.floor((milliseconds - time_start) / 1000)
    }
    /*if (Math.floor((milliseconds - time_start)/1000.0)==1.75*60*60) {
        new Audio('{% static "sounds/notif.mp3" %}').play()
    }*/
    result = total_time - result;
    hours = Math.floor(result / 60 / 60)
    result = result - 60 * 60 * hours
    minutes = Math.floor(result / 60) 
    result = result - 60 * minutes
    seconds = result
    
    hours_1 = Math.floor(hours / 10)
    hours_2 = hours - 10 * hours_1
    
    minutes_1 = Math.floor(minutes / 10)
    minutes_2 = minutes - 10 * minutes_1
    
    seconds_1 = Math.floor(seconds / 10)
    seconds_2 = seconds - 10 * seconds_1
    $("#seconds_1").html(seconds_1)
    $("#seconds_2").html(seconds_2)
    
    $("#minutes_1").text(minutes_1)
    $("#minutes_2").text(minutes_2)
    
    $("#hours_1").text(hours_1)
    $("#hours_2").text(hours_2)
    
    start_string = "Go"
    
    if (countdown_value == 0) {
        if ($("#countdown").text() != start_string) {
            $("#countdown").show();
            $("#countdown").text(start_string);
            setTimeout(function(){$("#countdown").fadeOut( "slow" );},2000);
            new Audio('{% static "sounds/gong.mp3" %}').play()
        }
    }
    else if (countdown_value != -1) {
        $("#countdown").show();
        $("#countdown").text(countdown_value)
        $("#countdown").fadeOut( "slow" );
    }    
    else {
        $("#countdown").text("")
    }
    
}
function show_countdown () {
    countdown_value -= 1;
    if (countdown_value == 0) {
        time_start = new Date().getTime();// - 2*60*60*1000 + 920000;
        set_counter(time_start);
        setTimeout(show_countdown, 4000);
    }
    else if (countdown_value == -1) {
        null;
    }
    else {
        setTimeout(show_countdown, 900);
    }
    
}

function set_counter (value) {
    data = {
        'csrfmiddlewaretoken': '{{ csrf_token }}',
    }
    $.post( "counter_start?new_value=" + value, data, function( data ) {
      console.log("counter changed");
    });
}

function restart_main_interval () {
    clearInterval(main_interval);
    show_counter();
    main_interval = setInterval(show_counter, 1000);
}


function apply_counter_state(value) {
    value = parseInt(value);
    time_start = value;
    if (value == -3) {
        set_counter(-1);
        countdown_value = 4;
        show_countdown();
        restart_main_interval();
    } else {
        // Running timer or stopped — restart display loop with the fetched value.
        restart_main_interval();
    }
}

// Pull current counter value immediately on load; don't wait for a WS push.
$.post("counter_start", {'csrfmiddlewaretoken': '{{ csrf_token }}'}, function(data) {
    apply_counter_state(data);
});


var getUrlParameter = function getUrlParameter() {
    return window.location.href.substring(window.location.href.lastIndexOf('/') + 1)
};

(function() {
    var scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    var subdomain = '{{ subdomain }}';
    function connect() {
        var ws = new WebSocket(scheme + '://' + location.host + '/ws/display/' + subdomain + '/');
        ws.onmessage = function(e) {
            var msg = JSON.parse(e.data);
            if (msg.event === 'counter_update') {
                apply_counter_state(msg.counter);
            } else if (msg.event === 'screen_update') {
                location.reload();
            } else {
                // leaderboard_update / variables_update: only reload if the
                // round timer isn't currently running (avoids flicker mid-round).
                var total_time = {{ variables.total_time }};
                var running = time_start > 0 && (new Date().getTime() - time_start) < total_time * 1000;
                // also check countdown value, in case the timer is in the 4-second countdown phase before starting.
                var countdown_running = countdown_value > 0;
                if (!running && !countdown_running) location.reload();
            }
        };
        ws.onclose = function() { setTimeout(connect, 3000); };
        ws.onerror = function() { ws.close(); };
    }
    connect();
})();

const tryToPlay = setInterval(() => {
    const audio = new Audio('{% static "sounds/gong.mp3" %}');
    audio.volume = 0;
    audio.play()
        .then(() => {
            clearInterval(tryToPlay);
            $("#no_sound").hide();
        })
        .catch(error => {
            console.info('User has not interacted with document yet.');
            $("#no_sound").show();
        });
}, 1000);

tryToPlay;
</script>
</body>
