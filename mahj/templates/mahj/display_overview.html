{% load static %}

<html style="background-color:black;">
<head>
  <title>Screens overview</title>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="{% static "images/mcr_logo.png" %}" sizes="192?192">
  <style>
    html, body { margin: 0; height: 100%; background: black; overflow: hidden; }
    /* Near-square grid: {{ cols }} columns × {{ rows }} rows for {{ screens|length }} screen(s). */
    #grid {
      width: 100vw; height: 100vh;
      display: grid;
      grid-template-columns: repeat({{ cols }}, 1fr);
      grid-template-rows: repeat({{ rows }}, 1fr);
      gap: 4px;
      box-sizing: border-box;
      padding: 4px;
    }
    .cell {
      position: relative;
      background: black;
      overflow: hidden;
      border: 1px solid #333;
      box-sizing: border-box;
    }
    /* Each iframe renders a full 1920×1080 screen, then is scaled (via JS) and
       centred to fit its cell while keeping the 16:9 aspect ratio. */
    .cell iframe {
      position: absolute;
      width: 1920px; height: 1080px;
      border: 0;
      left: 50%; top: 50%;
      transform-origin: center center;
    }
    .label {
      position: absolute;
      right: 6px; top: 4px;
      z-index: 10;
      background: #aaaaaacc;
      border: 1px solid #888;
      color: black;
      font: 11px/1.2 monospace;
      padding: 2px 8px;
      border-radius: 3px;
      pointer-events: none;
    }
    .enlarge {
      position: absolute;
      left: 6px; top: 4px;
      z-index: 10;
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      background: #aaaaaacc;
      border: 1px solid #888;
      border-radius: 3px;
      color: black;
      cursor: pointer;
      opacity: 0;
      transition: opacity .15s;
    }
    .cell:hover .enlarge { opacity: 1; }
    .enlarge svg { width: 16px; height: 16px; }
    #empty {
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      color: #888; font: 24px sans-serif;
    }
    /* Enlarged-screen modal */
    #modal {
      position: fixed; inset: 0; z-index: 100;
      display: none;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,.85);
    }
    #modal-frame { background: black; overflow: hidden; }
    #modal-iframe {
      width: 1920px; height: 1080px; border: 0;
      transform-origin: top left;
    }
    #modal-close {
      position: absolute; right: 16px; top: 12px;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      background: #ffffffdd; border: 0; border-radius: 6px;
      cursor: pointer; color: #111;
    }
    #modal-close svg { width: 22px; height: 22px; }
    #modal-title {
      position: absolute; left: 16px; top: 16px;
      color: #fff; font: bold 16px sans-serif;
      text-shadow: 0 1px 3px rgba(0,0,0,.8);
    }
  </style>
</head>
<body>

{% if screens %}
  <div id="grid">
    {% for screen in screens %}
      <div class="cell">
        <div class="label">Screen {{ forloop.counter }}</div>
        <button type="button" class="enlarge" title="Enlarge"
                data-src="{{ forloop.counter }}" data-label="Screen {{ forloop.counter }}">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
        </button>
        <iframe src="{{ forloop.counter }}" scrolling="no" tabindex="-1"></iframe>
      </div>
    {% endfor %}
  </div>

  <div id="modal">
    <div id="modal-title"></div>
    <button type="button" id="modal-close" title="Close">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
    <div id="modal-frame"><iframe id="modal-iframe" scrolling="no"></iframe></div>
  </div>
{% else %}
  <div id="empty">No screens configured</div>
{% endif %}

<script>
  // Scale every 1920×1080 iframe so it fills its cell (contain, keeping 16:9).
  function fitFrames() {
    document.querySelectorAll('.cell').forEach(function(cell) {
      var iframe = cell.querySelector('iframe');
      if (!iframe) return;
      var scale = Math.min(cell.clientWidth / 1920, cell.clientHeight / 1080);
      // left/top:50% put the iframe's top-left at the cell centre; translate by
      // -50% of its own (1920×1080) box recentres it, then scale about centre.
      iframe.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
    });
  }
  window.addEventListener('resize', fitFrames);
  window.addEventListener('load', fitFrames);
  fitFrames();

  // --- enlarge a single screen to a fitted full-viewport modal ---------------
  var modal = document.getElementById('modal');
  var modalFrame = document.getElementById('modal-frame');
  var modalIframe = document.getElementById('modal-iframe');
  var modalTitle = document.getElementById('modal-title');

  function openModal(src, label) {
    // Fit a 1920×1080 frame inside the viewport, never upscaling past 1:1.
    var scale = Math.min((window.innerWidth - 48) / 1920, (window.innerHeight - 48) / 1080, 1);
    modalIframe.style.transform = 'scale(' + scale + ')';
    modalFrame.style.width = (1920 * scale) + 'px';
    modalFrame.style.height = (1080 * scale) + 'px';
    modalTitle.textContent = label;
    modalIframe.src = src;
    modal.style.display = 'flex';
  }

  function closeModal() {
    modal.style.display = 'none';
    modalIframe.removeAttribute('src');
  }

  if (modal) {
    document.querySelectorAll('.enlarge').forEach(function(btn) {
      btn.addEventListener('click', function() {
        openModal(btn.getAttribute('data-src'), btn.getAttribute('data-label'));
      });
    });
    document.getElementById('modal-close').addEventListener('click', closeModal);
    // Close when clicking the dark backdrop, but not the screen frame itself.
    modal.addEventListener('click', function(e) { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
  }
</script>

<script src="{% static 'js/display_socket.js' %}"></script>
<script>
  // Adding/removing screens changes the grid, so reload the overview itself.
  // (Each iframe already self-reloads on its own content changes.)
  connectDisplaySocket({
    subdomain: '{{ subdomain }}',
    onUpdate: function() { location.reload(); },
  });
</script>
</body>
</html>
