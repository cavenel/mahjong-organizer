{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan score sheet</title>
  <link rel="icon" type="image/x-icon" href="{% static 'images/mcr_logo.png' %}">
  <link rel="stylesheet" href="{% static 'css/tailwind.min.css' %}?v={% now "YmdHi" %}">
</head>

<body class="min-h-full bg-gray-50 text-gray-900 flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-sm">

    <h1 class="text-2xl font-bold text-gray-800 mb-1 text-center">Scan score sheet</h1>
    <p class="text-sm text-gray-600 mb-6 text-center">Enter the round and table, then take a clear photo of the whole A4 sheet.</p>

    <!-- ====== OFFLINE BANNER ====== -->
    <div id="offline-banner" class="hidden rounded-lg p-2 text-xs font-semibold text-center mb-4 bg-gray-800 text-white">
      Offline — waiting for connection…
    </div>

    <!-- ====== ROUND / TABLE ====== -->
    <div class="flex gap-4 justify-center mb-3">
      <label class="flex flex-col items-center gap-1">
        <span class="text-xs font-medium text-gray-500 uppercase tracking-wider">Round</span>
        <input type="number" id="round" min="1"
               class="w-20 border border-gray-300 rounded-lg px-2 py-2 text-center text-lg font-bold">
      </label>
      <label class="flex flex-col items-center gap-1">
        <span class="text-xs font-medium text-gray-500 uppercase tracking-wider">Table</span>
        <input type="number" id="table" min="1"
               class="w-20 border border-gray-300 rounded-lg px-2 py-2 text-center text-lg font-bold">
      </label>
    </div>

    <!-- ====== STATUS BADGE ====== -->
    <div id="status" class="hidden rounded-lg p-2 text-xs font-semibold text-center mb-4"></div>

    <!-- ====== SCAN BUTTON ====== -->
    <label id="scan-label"
           class="flex flex-col items-center justify-center gap-2 p-6 border border-gray-300 rounded-xl cursor-pointer bg-white shadow-sm mb-4">
      <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      <span class="text-sm font-medium text-gray-600">Tap to take photo</span>
      <input type="file" id="file" class="hidden" accept="image/*" capture="environment">
    </label>

    <!-- ====== PROGRESS ====== -->
    <div id="progress" class="hidden items-center justify-center gap-3 rounded-lg px-4 py-3 bg-amber-50 text-amber-700 mb-4">
      <svg class="w-5 h-5 animate-spin text-amber-500 shrink-0" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
      </svg>
      <span id="progress-text" class="text-sm font-medium">Reading sheet…</span>
    </div>

    <!-- ====== RESULTS LIST ====== -->
    <div id="results" class="space-y-2"></div>

  </div>

  <!-- ====== SCORE-SHEET IFRAME OVERLAY ====== -->
  <div id="overlay" class="hidden fixed inset-0 z-50 bg-black/50 flex flex-col">
    <div class="flex items-center justify-between bg-white px-4 py-2 shadow">
      <span id="overlay-title" class="text-sm font-semibold text-gray-700"></span>
      <button id="overlay-close" class="px-3 py-1 rounded text-sm font-semibold bg-gray-200 text-gray-700 hover:bg-gray-300">Close ✕</button>
    </div>
    <iframe id="overlay-frame" class="flex-1 w-full bg-white" src="about:blank"></iframe>
  </div>

<script>
const csrf = '{{ csrf_token }}';
const roundEl  = document.getElementById('round');
const tableEl  = document.getElementById('table');
const fileEl   = document.getElementById('file');
const scanLabel= document.getElementById('scan-label');
const statusEl = document.getElementById('status');
const progress = document.getElementById('progress');
const progressText = document.getElementById('progress-text');
const resultsEl= document.getElementById('results');
const offlineBanner = document.getElementById('offline-banner');

/* ====== ROBUST JSON REQUESTS ======
   fetch() only rejects on a real network failure; an expired session instead
   returns the login page (HTML) with a 200, which then explodes as
   "unexpected token '<'" when parsed as JSON. Classify the failure so the
   message tells the user what to actually do. */
async function requestJSON(url, options) {
  let res;
  try {
    res = await fetch(url, options);
  } catch (e) {
    if (e.name === 'AbortError') throw e;   // a newer request superseded this one
    throw new Error(navigator.onLine
      ? 'Could not reach the server. Check your connection and try again.'
      : 'You are offline. Reconnect and try again — your data was not sent.');
  }
  // Auth gate redirected us to the login page → the session expired.
  if ((res.redirected && /\/accounts\/login/.test(res.url)) || res.status === 401 || res.status === 403) {
    throw new Error('Your session expired. Reload the page and sign in again, then re-scan.');
  }
  const ctype = res.headers.get('content-type') || '';
  if (!ctype.includes('application/json')) {
    const text = await res.text().catch(() => '');
    if (/login|sign in|password/i.test(text)) {
      throw new Error('Your session expired. Reload the page and sign in again, then re-scan.');
    }
    throw new Error(`Unexpected server response (HTTP ${res.status}). Try again, or reload the page.`);
  }
  return { res, data: await res.json() };
}

/* Pre-fill: context (QR deep-link) wins, else remembered round from localStorage. */
const ctxRound = '{{ round_nb|default_if_none:"" }}';
const ctxTable = '{{ table_nb|default_if_none:"" }}';
roundEl.value = ctxRound || localStorage.getItem('scan_round') || '';
tableEl.value = ctxTable || '';

/* Current status of the entered round/table. */
let currentStatus = null;  // { positions, has_hands, validated }

function setStatus(cls, text) {
  statusEl.className = 'rounded-lg p-2 text-xs font-semibold text-center mb-4 ' + cls;
  statusEl.textContent = text;
  statusEl.classList.remove('hidden');
}

function setScanEnabled(enabled) {
  fileEl.disabled = !enabled;
  scanLabel.classList.toggle('opacity-50', !enabled);
  scanLabel.classList.toggle('pointer-events-none', !enabled);
}

let statusAbort = null;

async function refreshStatus() {
  const round_nb = roundEl.value;
  const table_nb = tableEl.value;
  currentStatus = null;

  if (!round_nb || !table_nb) {
    statusEl.classList.add('hidden');
    setScanEnabled(false);
    return;
  }

  if (statusAbort) statusAbort.abort();
  statusAbort = new AbortController();

  try {
    const { data } = await requestJSON(`scan_positions?round_nb=${round_nb}&table_nb=${table_nb}`, { signal: statusAbort.signal });
    currentStatus = data;

    if (!data.ok || data.positions.length === 0) {
      setStatus('bg-yellow-100 text-yellow-800', 'No positions found for this round/table.');
      setScanEnabled(true);   // allow scan anyway (positions may not be seeded yet)
    } else if (data.validated) {
      setStatus('bg-blue-100 text-blue-800', 'Already validated — locked. Edit on the score sheet.');
      setScanEnabled(false);
    } else if (data.has_hands) {
      setStatus('bg-amber-100 text-amber-800', 'Pre-filled but not valid — scanning will overwrite.');
      setScanEnabled(true);
    } else {
      setStatus('bg-green-100 text-green-800', 'Empty — ready to scan.');
      setScanEnabled(true);
    }
  } catch (e) {
    if (e.name === 'AbortError') return;
    setStatus('bg-red-100 text-red-800', e.message);
    setScanEnabled(false);
  }
}

roundEl.addEventListener('input', () => {
  if (roundEl.value) localStorage.setItem('scan_round', roundEl.value);
  refreshStatus();
});
tableEl.addEventListener('input', refreshStatus);

/* ====== RESULTS LIST ====== */

function addResult(round_nb, table_nb, ok, msg) {
  const div = document.createElement('div');
  if (ok) {
    div.className = 'flex items-center gap-3 rounded-lg px-4 py-3 bg-green-50 text-green-800';
    div.innerHTML =
      `<span class="text-lg">✅</span>` +
      `<div class="flex flex-col min-w-0"><span class="text-sm font-medium">R${round_nb} T${table_nb}</span>` +
      `<span class="text-xs opacity-70">Saved (not valid)</span></div>` +
      `<button class="ml-auto px-3 py-1 rounded text-xs font-semibold bg-green-600 text-white hover:bg-green-700">Open score sheet</button>`;
    div.querySelector('button').addEventListener('click', () => openSheet(round_nb, table_nb));
  } else {
    div.className = 'flex items-center gap-3 rounded-lg px-4 py-3 bg-red-50 text-red-700';
    div.innerHTML = `<span class="text-lg">❌</span><span class="text-xs truncate">R${round_nb} T${table_nb}: ${msg}</span>`;
  }
  resultsEl.prepend(div);
}

/* ====== SCORE-SHEET IFRAME OVERLAY ====== */

const overlay = document.getElementById('overlay');
const overlayFrame = document.getElementById('overlay-frame');
const overlayTitle = document.getElementById('overlay-title');

function openSheet(round_nb, table_nb) {
  overlayTitle.textContent = `Round ${round_nb} – Table ${table_nb}`;
  overlayFrame.src = `scores_per_hand_${round_nb}_${table_nb}`;
  overlay.classList.remove('hidden');
}
function closeSheet() {
  overlay.classList.add('hidden');
  overlayFrame.src = 'about:blank';
  refreshStatus();   // validation/edits in the sheet may have changed status
}
document.getElementById('overlay-close').addEventListener('click', closeSheet);

/* ====== SCAN ====== */

fileEl.addEventListener('click', function (e) {
  // Guard before the camera opens: require round/table, confirm overwrite.
  const round_nb = roundEl.value;
  const table_nb = tableEl.value;
  if (!round_nb || !table_nb) {
    e.preventDefault();
    alert('Enter a round and table first.');
    return;
  }
  if (currentStatus && currentStatus.has_hands && !currentStatus.validated) {
    if (!confirm(`Round ${round_nb} Table ${table_nb} already has data. Overwrite it?`)) {
      e.preventDefault();
    }
  }
});

fileEl.addEventListener('change', async function () {
  if (!this.files[0]) return;
  const file = this.files[0];
  this.value = '';

  const round_nb = parseInt(roundEl.value);
  const table_nb = parseInt(tableEl.value);
  const force = !!(currentStatus && currentStatus.has_hands);

  progressText.textContent = `Reading R${round_nb} T${table_nb}…`;
  progress.classList.remove('hidden');
  progress.classList.add('flex');
  setScanEnabled(false);

  try {
    const fd = new FormData();
    fd.append('image', file);
    fd.append('csrfmiddlewaretoken', csrf);

    const { data } = await requestJSON('scan', { method: 'POST', body: fd });
    if (!data.ok) throw new Error(data.error || 'Could not read the sheet. Retake a clear, flat photo.');

    progressText.textContent = `Saving R${round_nb} T${table_nb}…`;
    const { data: pdata } = await requestJSON('scan_prefill', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf },
      body: JSON.stringify({
        round_nb, table_nb, scores: data.scores, validate: false, force,
      }),
    });
    if (!pdata.ok) throw new Error(pdata.error || 'Save failed.');

    addResult(round_nb, table_nb, true);
    tableEl.value = '';        // clear table, keep round, for the next sheet
    tableEl.focus();
    refreshStatus();
  } catch (e) {
    addResult(round_nb, table_nb, false, e.message);
  } finally {
    progress.classList.add('hidden');
    progress.classList.remove('flex');
    setScanEnabled(true);
  }
});

/* ====== ONLINE / OFFLINE ====== */
function handleOffline() {
  offlineBanner.classList.remove('hidden');
  setScanEnabled(false);
}
function handleOnline() {
  offlineBanner.classList.add('hidden');
  refreshStatus();   // re-enables scanning and refreshes the table status
}
window.addEventListener('offline', handleOffline);
window.addEventListener('online', handleOnline);

/* Initial state */
setScanEnabled(false);
if (!navigator.onLine) handleOffline(); else refreshStatus();
</script>
</body>
</html>
