{% load static %} 

<html>
<head>
  <title>{{ variables.title|default:"Mahjong Tournament" }}</title>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="{% static "images/mcr_logo.png" %}" sizes="192?192">

<link rel="stylesheet" href="{% static "images/flags.css" %}">
<link rel="stylesheet" href="{% static 'css/bootstrap-3.3.7.min.css' %}">
  <script src="{% static 'js/jquery-3.7.1.min.js' %}"></script>
<style>

body, html {
}
</style>
</head>
<body> 
    <style>
        table{
            background-color:white;
            white-space: nowrap;
            border-collapse:collapse;width:max-content;margin-top:5px;font-size:11px;
            margin-left: auto;
            margin-right: auto;}
        table > tbody > tr > td{border:1px solid #aaa;padding:2px; padding-left:5px;padding-right:5px;}
        th {
            text-align:right;
        }
        .vert {
            vertical-align:bottom;
        }
        .vert span {
            writing-mode: vertical-rl;
            -webkit-writing-mode: vertical-rl;
            -ms-writing-mode: vertical-rl;
            text-align:left;
            vertical-align:bottom;
        }
    </style>
    <table>
    <thead>
    <tr>
      <th style="width: 50px;"><center></center></th>
      <th style="width: 50px;vertical-align: bottom"><center># East<br/>&nbsp;</center></th>
      {% for c in cross %}
      <th class="vert" style="width: 55px;width:10px;"><span>{{ c.player }}&nbsp;&nbsp;</span></th>
      {% endfor %}
    </tr>
    </thead>
    {% for c in cross %}
    <tr>
      <th style="height: 18px;">{{ c.player }}</th>
      <th><center>{{ c.east }}</center></th>
      {% for c_c in c.cross %}
      <td data-val="{{ c_c }}" style="text-align:center;width:10px;"> {{ c_c }}</td>
      {% endfor %}
    </tr> 
    {% endfor %}
    </table>
  <script>
    const cells = document.querySelectorAll('td[data-val]');
    const max = Math.max(...[...cells].map(c => +c.dataset.val));
    if (max > 0) {
      cells.forEach(c => {
        const alpha = +c.dataset.val / max;
        c.style.backgroundColor = `rgba(220,38,38,${alpha.toFixed(3)})`;
        c.style.color = alpha > 0.5 ? '#fff' : '#111';
      });
    }
  </script>
</body>
