{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results not yet revealed</title>
  <link rel="stylesheet" href="{% static 'css/tailwind.min.css' %}">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-10 bg-white border-b border-gray-200 shadow-sm">
    <div class="flex items-center h-12 px-4 gap-3">
      <button onclick="goBack()"
              class="text-amber-600 text-sm font-medium shrink-0">‹ Back</button>
      <span class="flex-1 font-semibold text-gray-800 text-sm text-center">
        Round {{ round_nb }} – Table {{ table_nb }}
      </span>
      <span class="shrink-0 w-12"></span>
    </div>
  </header>

  <main class="py-10 px-6 max-w-md mx-auto text-center">
    <div class="text-4xl mb-4">🏆</div>
    <h2 class="text-lg font-semibold text-gray-800 mb-2">Results not yet revealed</h2>
    <p class="text-sm text-gray-500">
      The detailed scores for this round will be available once they are revealed
      at the prize-giving ceremony.
    </p>
  </main>

  <script>
    function goBack() {
      if (window.parent !== window && typeof window.parent.modalGoBack === 'function') {
        window.parent.modalGoBack();
      } else {
        history.back();
      }
    }
  </script>
</body>
</html>
