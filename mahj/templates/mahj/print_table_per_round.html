{% load static %} 
{% if table.1 %}
<div style="width:100%; text-align:-webkit-center; vertical-align: middle; height:208px;">
    <table class="table_table" style="zoom:1.0;">
        <tr>
            <td></td>
            <td colspan=4 class="name_top">{{ table.3.first_name }}</td>
            <td></td>
        </tr>
        <tr>
            <td rowspan=3 class="name_left"><p>{{ table.0.first_name }}</p></td>
            <td class="carpet"></td>
            <td colspan=2 class="carpet" style="text-align:center;">N</td>
            <td class="carpet"></td>
            <td rowspan=3 class="name_right"><p>{{ table.2.first_name }}</p></td>
        </tr>
        <tr>
            <td class="carpet"><b>E</b></td>
            <td colspan=2 class="carpet" style="height:60px;font-size:51px;font-weight:bold;">{{ forloop_counter }}</td>
            <td class="carpet">W</td>
        </tr>
        <tr>
            <td class="carpet"></td>
            <td colspan=2 class="carpet" style="text-align:center;">S</td>
            <td class="carpet"></td>
        </tr>
        <tr>
            <td></td>
            <td colspan=4 class="name_bottom">{{ table.1.first_name }}</td>
            <td></td>
        </tr>
    </table>
</div>
{% endif %}
