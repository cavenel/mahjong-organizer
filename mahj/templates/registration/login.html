{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="icon" type="image/png" href="{% static 'images/mcr_logo.png' %}" sizes="192x192">
  <link rel="stylesheet" href="{% static 'css/tailwind.min.css' %}">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">

    <!-- Logo + title -->
    <div class="text-center mb-8">
      <img src="{{ site_logo_url }}" class="h-14 w-auto mx-auto mb-3">
      <h1 class="text-xl font-bold text-gray-800">Mahjong Tournament</h1>
      <p class="text-sm text-gray-500 mt-1">Sign in to your account</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm px-8 py-8">
      {% if form.errors %}
        <div class="mb-4 rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
          Invalid username or password.
        </div>
      {% elif request.GET.expired %}
        <div class="mb-4 rounded-lg bg-amber-50 border border-amber-200 px-4 py-3 text-sm text-amber-800">
          Your session expired — please sign in again.
        </div>
      {% endif %}

      <form method="post" action="/accounts/login/?next={{ next }}"
            onsubmit="var m=document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);if(m){this.csrfmiddlewaretoken.value=m[1];}">
        {% csrf_token %}
        <div class="space-y-4">
          <div>
            <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input type="text" name="username" id="id_username" autocomplete="username" required autofocus
                   class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-900
                          focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-amber-400">
          </div>
          <div>
            <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" id="id_password" autocomplete="current-password" required
                   class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-900
                          focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-amber-400">
          </div>
        </div>

        <button type="submit"
                class="mt-6 w-full py-2.5 rounded-lg bg-amber-500 hover:bg-amber-600 text-white
                       font-semibold text-sm transition-colors">
          Sign in
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">
      <a href="/" class="hover:text-gray-600">← Back to tournament</a>
    </p>
  </div>
</body>
</html>
