name: Build standalone binaries

# Builds the per-OS standalone admin binary (docs/hosting/STANDALONE.md) and, on a
# version tag, drafts a GitHub Release with the archives attached.
#
# There is no cross-platform binary — each target is built on its native runner
# (standalone/mahj.spec). The build mirrors the Dockerfile's CSS step: fetch the
# standalone Tailwind CLI, compile tailwind.min.css, collectstatic, then freeze.
on:
  push:
    tags: ['v*']
  workflow_dispatch:   # manual test builds without tagging

# Read-only by default; only the release job gets write, and only to contents.
# The build jobs run third-party code (pip, the Tailwind CLI, PyInstaller) and have
# no reason to hold a token that can push to the repo.
permissions:
  contents: read

env:
  TAILWIND_VERSION: v3.4.17
  PYTHON_VERSION: '3.12'

jobs:
  # The suite gates the build, rather than running beside it: `git tag v1.2.3` used to
  # publish binaries straight from whatever the tree happened to be, with no test job
  # anywhere in the graph. Reuses ci.yml so there is one definition of "the tests".
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            tw_suffix: windows-x64.exe
            tw_sha256: 67f1c5e3f5a03406a7bf5badf5ada09b79f3ae78ec43450c15f7e983068da346
            tw_bin: tailwindcss.exe
          - os: macos-14        # Apple Silicon
            target: macos-arm64
            tw_suffix: macos-arm64
            tw_sha256: a1d0c7985759accca0bf12e51ac1dcbf0f6cf2fffb62e6e0f62d091c477a10a3
            tw_bin: tailwindcss
          - os: macos-15-intel  # Intel
            target: macos-x64
            tw_suffix: macos-x64
            tw_sha256: 6cbdad74be776c087ffa5e9a057512c54898f9fe8828d3362212dfe32fc933a3
            tw_bin: tailwindcss
          - os: ubuntu-latest
            target: linux-x64
            tw_suffix: linux-x64
            tw_sha256: 7d24f7fa191d2193b78cd5f5a42a6093e14409521908529f42d80b11fde1f1d4
            tw_bin: tailwindcss
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download Tailwind CLI
        run: |
          curl -sSL -o "${{ matrix.tw_bin }}" \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-${{ matrix.tw_suffix }}"
          # Checksum from the release's sha256sums.txt (see the matrix). The binary
          # is downloaded and then run, so without this every release build trusts
          # whatever that URL serves on the day. sha256sum on Linux and Git-for-
          # Windows, shasum on macOS.
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${{ matrix.tw_sha256 }}  ${{ matrix.tw_bin }}" | sha256sum -c -
          else
            echo "${{ matrix.tw_sha256 }}  ${{ matrix.tw_bin }}" | shasum -a 256 -c -
          fi
          chmod +x "${{ matrix.tw_bin }}"

      - name: Compile Tailwind CSS
        run: |
          "./${{ matrix.tw_bin }}" -c tailwind.config.js \
            -i mahj/static/css/tailwind.src.css \
            -o mahj/static/css/tailwind.min.css --minify

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/standalone.txt

      - name: Collect static files
        env:
          DJANGO_SECRET_KEY: build-time-only
          ALLOWED_HOSTS: localhost
        run: python manage.py collectstatic --noinput --settings apps.settings.standalone

      - name: Build with PyInstaller
        run: pyinstaller standalone/mahj.spec

      - name: Package archive
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../mahj-admin-${{ matrix.target }}.zip" mahj-admin
          else
            tar czf "../mahj-admin-${{ matrix.target }}.tar.gz" mahj-admin
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: mahj-admin-${{ matrix.target }}
          path: mahj-admin-${{ matrix.target }}.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # attaches the archives to the draft release
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Draft release
        # Pinned to a full commit SHA, not a moving tag: this third-party action
        # runs with a contents:write token, so a retagged v2 would be able to push
        # to the repo. Bump deliberately (this is v2.6.2).
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: artifacts/**/*
          draft: true                    # review, then publish manually
          generate_release_notes: true
